<!DOCTYPE html>
<html>
<head>
<title>X Content Generator</title>
</head>
<body>

<h1>X Content Generator</h1>

<p>Paste your X trending topic:</p>

<input type="text" id="trend" placeholder="Enter X trend">

<br><br>

<button onclick="generatePrompt()">Generate Prompt</button>
<script>
function generatePrompt() {
  const trend = document.getElementById("trend").value;

  alert(
    "Trend: " + trend +
    "\n\nCopy this into ChatGPT:\n\n" +
    "Create 10 YouTube titles, a Shorts script, hashtags, Instagram caption, X post, and content ideas for: " + trend
  );
}
</script>
</body>
</html>
